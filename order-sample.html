<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Details Popup</title>

  <style>
    :root {
      --ink: #24211e;
      --muted: #77716a;
      --line: #d8d2c9;
      --white: #fffefa;
      --brown: #49372c;
      --brown-dark: #32251e;
      --serif: "Times New Roman", Georgia, serif;
      --sans: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #d8cbbb;
      color: var(--ink);
      font-family: var(--sans);
    }

    /* Storefront background for the popup preview */
    .storefront {
      min-height: 100vh;
      background:
        linear-gradient(rgba(65, 47, 34, .15), rgba(65, 47, 34, .04)),
        #d8cbbb;
    }

    .nav {
      height: 58px;
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, .55);
      color: #fff;
      font-size: 11px;
      letter-spacing: .04em;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .brand {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .2em;
    }

    .hero {
      min-height: calc(100vh - 58px);
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 78%, rgba(87, 55, 31, .28), transparent 35%),
        linear-gradient(180deg, #c6b7a3 0%, #e6ded2 74%, #c4ad94 100%);
    }

    .hero-copy {
      color: rgba(255, 255, 255, .92);
      text-shadow: 0 1px 12px rgba(47, 34, 24, .18);
    }

    .hero-copy small {
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .hero-copy h1 {
      margin: 14px 0 0;
      font-family: var(--serif);
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 400;
    }

    /* Popup overlay */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(27, 23, 20, .52);
      animation: fade-in .25s ease-out;
    }

    .popup {
      position: relative;
      width: min(840px, 100%);
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      background: var(--white);
      box-shadow: 0 22px 70px rgba(23, 18, 14, .25);
      animation: rise-in .3s ease-out;
    }

    /* Image panel */
    .intro {
      position: relative;
      min-height: 570px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 35px 36px;
      color: #f8f4ee;
      background: var(--brown-dark);
    }

    .intro-image,
    .intro-shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .intro-image {
      object-fit: cover;
      object-position: center;
    }

    .intro-shade {
      background:
        linear-gradient(
          180deg,
          rgba(24, 18, 14, .4) 0%,
          rgba(24, 18, 14, .05) 38%,
          rgba(24, 18, 14, .82) 100%
        );
    }

    .intro > *:not(.intro-image):not(.intro-shade) {
      position: relative;
      z-index: 1;
    }

    .intro .brand {
      display: inline-block;
      font-size: 14px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .35);
    }

    .intro-copy {
      margin-top: auto;
      padding-top: 40px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 15px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .intro h1 {
      max-width: 300px;
      margin: 0 0 15px;
      font-family: var(--serif);
      font-size: clamp(34px, 4vw, 43px);
      font-weight: 400;
      line-height: 1.08;
    }

    .intro p {
      max-width: 290px;
      margin: 0;
      color: rgba(248, 244, 238, .88);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.55;
    }

    /* Form panel */
    .form-panel {
      padding: 48px 48px 42px;
    }

    .form-topline {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .form-panel h2 {
      margin: 0 0 28px;
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 400;
      line-height: 1.2;
    }

    .field {
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #47413b;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .required-star {
      color: #b33a2b;
      font-size: 13px;
      margin-left: 3px;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }

    .field input {
      height: 43px;
      padding: 0 12px;
    }

    .field textarea {
      min-height: 76px;
      padding: 11px 12px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #a29a91;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--brown);
      box-shadow: 0 0 0 2px rgba(73, 55, 44, .1);
    }

    .address-field {
      margin-bottom: 22px;
    }

    .privacy-note {
      margin: -7px 0 18px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 12px;
      line-height: 1.45;
    }

    .submit {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--brown-dark);
      background: var(--brown-dark);
      color: var(--white);
      cursor: pointer;
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: background .2s, color .2s;
    }

    .submit:hover {
      background: transparent;
      color: var(--brown-dark);
    }

    .close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
    }

    .close:hover {
      color: #8a6953;
    }

    .success {
      display: none;
      padding: 36px 0;
      text-align: center;
    }

    .success-mark {
      width: 42px;
      height: 42px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border: 1px solid var(--brown);
      border-radius: 50%;
      color: var(--brown);
      font-family: var(--serif);
      font-size: 22px;
    }

    .success h2 {
      margin-bottom: 10px;
    }

    .success p {
      color: var(--muted);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.5;
    }

    .popup.is-success .form-content {
      display: none;
    }

    .popup.is-success .success {
      display: block;
    }

    .reopen {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 4;
      padding: 13px 17px;
      border: 1px solid var(--brown-dark);
      background: var(--brown-dark);
      color: white;
      cursor: pointer;
      font: 10px var(--sans);
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .reopen.visible {
      display: block;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 680px) {
      .overlay {
        padding: 14px;
      }

      .popup {
        width: min(480px, 100%);
        max-height: calc(100vh - 28px);
        overflow-y: auto;
        grid-template-columns: 1fr;
      }

      .intro {
        min-height: 230px;
        padding: 23px 26px;
      }

      .intro-image {
        object-position: center 55%;
      }

      .intro-copy {
        padding-top: 25px;
      }

      .intro h1 {
        max-width: 350px;
        margin-bottom: 9px;
        font-size: 30px;
      }

      .intro p {
        max-width: 370px;
        font-size: 14px;
      }

      .form-panel {
        padding: 27px 26px 25px;
      }

      .form-panel h2 {
        margin-bottom: 22px;
        font-size: 24px;
      }

      .field {
        margin-bottom: 16px;
      }

      .field textarea {
        min-height: 68px;
      }

      .close {
        color: #fffefa;
      }

      .close:hover {
        color: #e8e0d4;
      }

      .nav-links {
        gap: 10px;
        font-size: 9px;
      }

      .nav-links span:nth-child(n + 3) {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="storefront" aria-label="Storefront popup preview">
    <nav class="nav" aria-label="Main navigation">
      <div class="nav-links">
        <span>Shop</span>
        <span>Upholstery &amp; Finishes</span>
        <span>Trade</span>
      </div>

      <div class="brand">CHESTER’S</div>

      <div class="nav-links">
        <span>Our Factory</span>
        <span>Our Story</span>
        <span>Contact</span>
      </div>
    </nav>

    <section class="hero">
      <div class="hero-copy">
        <small>Furniture for living</small>
        <h1>Made to feel at home.</h1>
      </div>
    </section>
  </main>

  <div class="overlay" id="overlay">
    <section
      class="popup"
      id="popup"
      role="dialog"
      aria-modal="true"
      aria-labelledby="popup-title"
    >
      <button
        class="close"
        id="closeButton"
        type="button"
        aria-label="Close popup"
      >×</button>

      <aside class="intro">
        <img
          class="intro-image"
          src="https://cdn.shopify.com/s/files/1/0662/5053/9195/files/Handcrafted-1.jpg?v=1789984868"
          alt="Knight Chesterfield two-seater sofa by Chester’s India"
          fetchpriority="high"
        >
        <div class="intro-shade"></div>

       

        <div class="intro-copy">
          </div>
      </aside>

      <div class="form-panel">
        <div class="form-content">
          <p class="form-topline">Your details</p>
          <h2>Explore Before You Decide</h2>

          <form id="deliveryForm">
            <div class="field">
              <label for="name">Name<span class="required-star" aria-hidden="true">*</span></label>
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Your full name"
                autocomplete="name"
                required
              >
            </div>

            <div class="field">
              <label for="email">Email address<span class="required-star" aria-hidden="true">*</span></label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              >
            </div>

            <div class="field">
              <label for="phone">Phone number<span class="required-star" aria-hidden="true">*</span></label>
              <input
                id="phone"
                name="phone"
                type="tel"
                placeholder="+91 00000 00000"
                autocomplete="tel"
                required
              >
            </div>

            <div class="field address-field">
              <label for="address">Delivery address<span class="required-star" aria-hidden="true">*</span></label>
              <textarea
                id="address"
                name="address"
                placeholder="House / flat, street, area, city and PIN code"
                autocomplete="street-address"
                required
              ></textarea>
            </div>

            <p class="privacy-note">We’ll use these details to help with your delivery.</p>
            <button class="submit" type="submit">Submit</button>
          </form>
        </div>

        <div class="success" role="status" aria-live="polite">
          <div class="success-mark">✓</div>
          <h2>Thank you</h2>
          <p>Your details have been saved in this preview.</p>
        </div>
      </div>
    </section>
  </div>

  <button class="reopen" id="reopenButton" type="button">
    Enter delivery details
  </button>

  <script>
    const overlay = document.getElementById("overlay");
    const popup = document.getElementById("popup");
    const form = document.getElementById("deliveryForm");
    const closeButton = document.getElementById("closeButton");
    const reopenButton = document.getElementById("reopenButton");

    function closePopup() {
      overlay.style.display = "none";
      reopenButton.classList.add("visible");
    }

    function openPopup() {
      overlay.style.display = "grid";
      reopenButton.classList.remove("visible");
      document.getElementById("name").focus();
    }

    closeButton.addEventListener("click", closePopup);
    reopenButton.addEventListener("click", openPopup);

    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) closePopup();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && overlay.style.display !== "none") {
        closePopup();
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      popup.classList.add("is-success");
    });
  </script>
</body>
</html>
